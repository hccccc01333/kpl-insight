<body data-page="compare-player.html">
<header id="siteHeader" class="topbar"></header>

<header class="page-hero">
  <div class="wrap">
    <div class="ph-kicker mono">COMPARE · 选手对比</div>
    <h1>选手对比</h1>
    <p>默认取<b>当前数据范围内出场达标（≥ 8 局）的前 3 名选手</b>放在一起，打开即可看结论，换对象在「高级条件」里改。
      雷达默认按<b>同位置分位</b>归一化（每名选手只和同位置选手比，越靠外越强），虚线为同位置中位 P50；可切「跨位置」看全选手口径。选择「位置」后，候选、分位与基准都只在该位置内计算。
      表格里的 KDA / 输出仍是原始值，跨位置不可直接比；要按分路看整体，用
      <a href="compare-lane.html" style="color:var(--gold);font-weight:700">「位置对比」</a>。
      想看战队 / 英雄？用 <a href="compare-team.html" style="color:var(--gold);font-weight:700">「战队对比」</a>
      / <a href="compare.html" style="color:var(--gold);font-weight:700">「英雄对比」</a>。</p>
  </div>
</header>

<main class="wrap" style="margin-top:26px">
  <div class="scopebar" id="scopeBar"></div>

  <div class="filterbar">
    <label class="fld"><span>位置</span>
      <select id="posFilter">
        <option value="all">全部位置</option>
        <option>对抗路</option>
        <option>打野</option>
        <option>中路</option>
        <option>发育路</option>
        <option>游走</option>
      </select>
    </label>
    <label class="fld"><span>分位口径</span>
      <select id="posNorm">
        <option value="pos" selected>同位置</option>
        <option value="all">跨位置</option>
      </select>
    </label>
    <div class="pickers" id="pickers"></div>
  </div>

  <div class="cmp-grid">
    <div class="cmp-radar">
      <div id="radar"></div>
      <div class="cmp-legend" id="legend"></div>
    </div>
    <div class="cmp-table">
      <table id="cmpTable"></table>
      <div class="cmp-tip" id="cmpTip"></div>
    </div>
  </div>
</main>
