    <h1>战队对比</h1>
    <p>默认拿<b>当前数据范围内单局胜率最高的 3 支战队</b>做多维度对比（阈值：大场数 ≥ 10），打开即可看结论，换对象在「高级条件」里改。
      雷达按<b>当前范围内全部达标战队的分位</b>归一化（越靠外越强），虚线为加权范围均值；也可切「趋势视图」看某几支战队逐年胜率。
      只看两队历史交锋？用 <a href="h2h.html" style="color:var(--gold);font-weight:700">「交手记录」</a>。
      想看英雄 / 选手 / 分路？用 <a href="compare.html" style="color:var(--gold);font-weight:700">「英雄对比」</a>
      / <a href="compare-player.html" style="color:var(--gold);font-weight:700">「选手对比」</a>
      / <a href="compare-lane.html" style="color:var(--gold);font-weight:700">「位置对比」</a>。</p>
