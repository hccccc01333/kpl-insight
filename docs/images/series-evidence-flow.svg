<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc">
<title id="title">04 / 系列赛证据报告</title><desc id="desc">逐局结果和快照经过比分、阵营与累计计数检查后生成统一报告，输出 JSON 和 Markdown。</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090f25"/><stop offset="1" stop-color="#1c1734"/></linearGradient>
<linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="1440"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#c4a0ff"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9ccfff" stroke-opacity=".045"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8badd0"/></marker>
</defs>
<rect width="1200" height="890" rx="28" fill="url(#bg)"/><rect width="1200" height="890" rx="28" fill="url(#grid)"/>
<path d="M52 50H100" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
<g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">
<text x="120" y="58" fill="#9fb9d8" font-size="18" letter-spacing="3">KPL INSIGHT / SYSTEM NOTES</text>
<text x="52" y="118" fill="#f2f6ff" font-size="36" font-weight="700">04 / 系列赛证据报告</text><text x="52" y="159" fill="#a7bad5" font-size="18">同一份结构化结果连接命令行与网站；事实、推断、待验证假设分层呈现。</text><g><rect x="60" y="205" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="60" y="224" width="4" height="28" rx="2" fill="#67e8f9"/><text x="84" y="248" fill="#f1f5ff" font-size="24" font-weight="700">逐局数据与过程记录</text><text x="84" y="284" fill="#becce0" font-size="20">赛程 / 胜方 / BP</text><text x="84" y="315" fill="#becce0" font-size="20">分钟快照 / 预测记录</text><text x="84" y="346" fill="#becce0" font-size="20">输入比赛标识</text></g><g><rect x="440" y="205" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="440" y="224" width="4" height="28" rx="2" fill="#67e8f9"/><text x="464" y="248" fill="#f1f5ff" font-size="24" font-weight="700">对齐与完整性检查</text><text x="464" y="284" fill="#becce0" font-size="20">战队身份 / 跨局换边</text><text x="464" y="315" fill="#becce0" font-size="20">逐局结果核对大场比分</text><text x="464" y="346" fill="#becce0" font-size="20">累计计数与缺失检查</text></g><g><rect x="820" y="205" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="820" y="224" width="4" height="28" rx="2" fill="#67e8f9"/><text x="844" y="248" fill="#f1f5ff" font-size="24" font-weight="700">提取分析内容</text><text x="844" y="284" fill="#becce0" font-size="20">经济与资源检查点</text><text x="844" y="315" fill="#becce0" font-size="20">逐局比较 / 候选窗口</text><text x="844" y="346" fill="#becce0" font-size="20">覆盖信息与结论分层</text></g><path d="M380 278H440" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M760 278H820" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="440" y="445" width="320" height="125" rx="17" fill="#101a30" stroke="#33415e"/><rect x="440" y="464" width="4" height="28" rx="2" fill="#f0abfc"/><text x="464" y="488" fill="#f1f5ff" font-size="24" font-weight="700">异常处理与降级</text><text x="464" y="524" fill="#becce0" font-size="20">报错 / 隔离 / 明示缺失</text><text x="464" y="555" fill="#becce0" font-size="20">不补造未采到的比赛过程</text></g><path d="M600 350V445" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="820" y="445" width="320" height="125" rx="17" fill="#101a30" stroke="#33415e"/><rect x="820" y="464" width="4" height="28" rx="2" fill="#a5b4fc"/><text x="844" y="488" fill="#f1f5ff" font-size="24" font-weight="700">Canonical JSON</text><text x="844" y="524" fill="#becce0" font-size="20">保存结构化事实与证据</text><text x="844" y="555" fill="#becce0" font-size="20">统一计算口径</text></g><path d="M980 350V445" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="60" y="660" width="320" height="125" rx="17" fill="#101a30" stroke="#33415e"/><rect x="60" y="679" width="4" height="28" rx="2" fill="#67e8f9"/><text x="84" y="703" fill="#f1f5ff" font-size="24" font-weight="700">Markdown 报告</text><text x="84" y="739" fill="#becce0" font-size="20">供阅读、复核与交流</text><text x="84" y="770" fill="#becce0" font-size="20">保留范围与方法说明</text></g><g><rect x="440" y="660" width="320" height="125" rx="17" fill="#101a30" stroke="#33415e"/><rect x="440" y="679" width="4" height="28" rx="2" fill="#67e8f9"/><text x="464" y="703" fill="#f1f5ff" font-size="24" font-weight="700">网站分析模块</text><text x="464" y="739" fill="#becce0" font-size="20">直接读取结构化报告</text><text x="464" y="770" fill="#becce0" font-size="20">不在前端重算另一套结论</text></g><g><rect x="820" y="660" width="320" height="125" rx="17" fill="#101a30" stroke="#33415e"/><rect x="820" y="679" width="4" height="28" rx="2" fill="#67e8f9"/><text x="844" y="703" fill="#f1f5ff" font-size="24" font-weight="700">固定基准检查</text><text x="844" y="739" fill="#becce0" font-size="20">核对输出与降级行为</text><text x="844" y="770" fill="#becce0" font-size="20">防止改动破坏既有契约</text></g><path d="M980 570V610H220V660" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M980 610H600V660" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M980 610V660" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M52 808H1148" stroke="#35425f"/><text x="52" y="847" fill="#9baec8" font-size="19">候选变化窗口是回看录像的线索；同时发生、统计关联或模型变化均不直接证明因果。</text></g></svg>
