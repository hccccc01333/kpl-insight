<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">05 / 从本地数据到公开网站</title><desc id="desc">本地采集与研究经过数据构建与发布后生成静态网站，访问者浏览文件而不是直接运行爬虫或训练。</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090f25"/><stop offset="1" stop-color="#1c1734"/></linearGradient>
<linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="1440"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#c4a0ff"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9ccfff" stroke-opacity=".045"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8badd0"/></marker>
</defs>
<rect width="1200" height="930" rx="28" fill="url(#bg)"/><rect width="1200" height="930" rx="28" fill="url(#grid)"/>
<path d="M52 50H100" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
<g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">
<text x="120" y="58" fill="#9fb9d8" font-size="18" letter-spacing="3">KPL INSIGHT / SYSTEM NOTES</text>
<text x="52" y="118" fill="#f2f6ff" font-size="36" font-weight="700">05 / 从本地数据到公开网站</text><text x="52" y="160" fill="#a7bad5" font-size="18">生产端与浏览端解耦：有新数据或代码修改，不代表网页已自动同步。</text><g><rect x="60" y="210" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="60" y="229" width="4" height="28" rx="2" fill="#67e8f9"/><text x="84" y="253" fill="#f1f5ff" font-size="24" font-weight="700">数据与分析工具</text><text x="84" y="289" fill="#becce0" font-size="20">采集快照 / 预测 / 统计</text><text x="84" y="320" fill="#becce0" font-size="20">构建分析表与报告</text><text x="84" y="351" fill="#becce0" font-size="20">核对来源、覆盖与格式</text></g><g><rect x="440" y="210" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="440" y="229" width="4" height="28" rx="2" fill="#67e8f9"/><text x="464" y="253" fill="#f1f5ff" font-size="24" font-weight="700">静态文件与页面构建</text><text x="464" y="289" fill="#becce0" font-size="20">生成展示数据与报告文件</text><text x="464" y="320" fill="#becce0" font-size="20">与独立站点页面接入</text><text x="464" y="351" fill="#becce0" font-size="20">保留更新时间和版本</text></g><g><rect x="820" y="210" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="820" y="229" width="4" height="28" rx="2" fill="#67e8f9"/><text x="844" y="253" fill="#f1f5ff" font-size="24" font-weight="700">发布前检查</text><text x="844" y="289" fill="#becce0" font-size="20">链接 / 页面 / 数据范围</text><text x="844" y="320" fill="#becce0" font-size="20">排除密钥和私人信息</text><text x="844" y="351" fill="#becce0" font-size="20">确认许可与发布文件</text></g><path d="M380 283H440" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M760 283H820" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="820" y="465" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="820" y="484" width="4" height="28" rx="2" fill="#a5b4fc"/><text x="844" y="508" fill="#f1f5ff" font-size="24" font-weight="700">网站仓与托管发布</text><text x="844" y="544" fill="#becce0" font-size="20">GitHub Pages / Actions</text><text x="844" y="575" fill="#becce0" font-size="20">Cloudflare Workers</text><text x="844" y="606" fill="#becce0" font-size="20">按实际发布流程更新</text></g><path d="M980 355V465" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="440" y="465" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="440" y="484" width="4" height="28" rx="2" fill="#a5b4fc"/><text x="464" y="508" fill="#f1f5ff" font-size="24" font-weight="700">浏览器访问</text><text x="464" y="544" fill="#becce0" font-size="20">加载 HTML / CSS / JS</text><text x="464" y="575" fill="#becce0" font-size="20">按需读取静态数据文件</text><text x="464" y="606" fill="#becce0" font-size="20">不启动采集或模型训练</text></g><path d="M820 538H760" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="60" y="465" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="60" y="484" width="4" height="28" rx="2" fill="#a5b4fc"/><text x="84" y="508" fill="#f1f5ff" font-size="24" font-weight="700">使用与核对</text><text x="84" y="544" fill="#becce0" font-size="20">查询 / 对比 / 复盘</text><text x="84" y="575" fill="#becce0" font-size="20">数据以部署版本为准</text><text x="84" y="606" fill="#becce0" font-size="20">电脑与手机响应式浏览</text></g><path d="M440 538H380" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="60" y="710" width="1080" height="110" rx="17" fill="#101a30" stroke="#33415e"/><rect x="60" y="729" width="4" height="28" rx="2" fill="#67e8f9"/><text x="84" y="753" fill="#f1f5ff" font-size="24" font-weight="700">功能扩展 → 本地验证 → PR 审阅 → 再次发布</text><text x="84" y="789" fill="#becce0" font-size="20">普通使用者也可以借助 AI 修改功能；验证通过并完成评审后，再进入后续发布版本。</text></g><path d="M220 610V710" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M52 848H1148" stroke="#35425f"/><text x="52" y="887" fill="#9baec8" font-size="19">示意图说明模块职责与数据流，不代表所有采集、训练和发布已配置为全自动执行。</text></g></svg>
