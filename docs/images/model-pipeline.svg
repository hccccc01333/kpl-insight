<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc">
<title id="title">03 / 训练、校准与独立评估</title><desc id="desc">真实比赛以整局为单位按时间隔离，训练集可结合辅助样本，校准集和测试集使用独立真实对局。</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090f25"/><stop offset="1" stop-color="#1c1734"/></linearGradient>
<linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="1440"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#c4a0ff"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9ccfff" stroke-opacity=".045"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8badd0"/></marker>
</defs>
<rect width="1200" height="1110" rx="28" fill="url(#bg)"/><rect width="1200" height="1110" rx="28" fill="url(#grid)"/>
<path d="M52 50H100" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
<g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">
<text x="120" y="58" fill="#9fb9d8" font-size="18" letter-spacing="3">KPL INSIGHT / SYSTEM NOTES</text>
<text x="52" y="118" fill="#f2f6ff" font-size="36" font-weight="700">03 / 训练、校准与独立评估</text><text x="52" y="159" fill="#a7bad5" font-size="18">整局隔离 + 时间顺序：同一局的相邻时点不拆到训练、校准和测试两端。</text><g><rect x="60" y="200" width="1080" height="115" rx="17" fill="#101a30" stroke="#33415e"/><rect x="60" y="219" width="4" height="28" rx="2" fill="#67e8f9"/><text x="84" y="243" fill="#f1f5ff" font-size="24" font-weight="700">真实比赛按时间与整局划分</text><text x="84" y="279" fill="#becce0" font-size="20">训练 / 校准 / 测试的比赛身份隔离，防止真实帧或辅助样本跨集合回流</text></g><g><rect x="60" y="395" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="60" y="414" width="4" height="28" rx="2" fill="#67e8f9"/><text x="84" y="438" fill="#f1f5ff" font-size="24" font-weight="700">TRAIN / 训练</text><text x="84" y="474" fill="#becce0" font-size="20">训练区间内真实快照</text><text x="84" y="505" fill="#becce0" font-size="20">合格训练局的辅助样本</text><text x="84" y="536" fill="#becce0" font-size="20">构建特征与历史先验</text></g><g><rect x="440" y="395" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="440" y="414" width="4" height="28" rx="2" fill="#67e8f9"/><text x="464" y="438" fill="#f1f5ff" font-size="24" font-weight="700">CALIBRATION / 校准</text><text x="464" y="474" fill="#becce0" font-size="20">隔离的真实比赛快照</text><text x="464" y="505" fill="#becce0" font-size="20">检查原始概率与实际结果</text><text x="464" y="536" fill="#becce0" font-size="20">辅助样本不充当真实校准</text></g><g><rect x="820" y="395" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="820" y="414" width="4" height="28" rx="2" fill="#67e8f9"/><text x="844" y="438" fill="#f1f5ff" font-size="24" font-weight="700">TEST / 测试</text><text x="844" y="474" fill="#becce0" font-size="20">更晚且隔离的真实比赛</text><text x="844" y="505" fill="#becce0" font-size="20">不参与模型与校准拟合</text><text x="844" y="536" fill="#becce0" font-size="20">保留对局、时点和版本</text></g><path d="M220 315V395" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 315V395" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M980 315V395" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="60" y="610" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="60" y="629" width="4" height="28" rx="2" fill="#a5b4fc"/><text x="84" y="653" fill="#f1f5ff" font-size="24" font-weight="700">分阶段模型</text><text x="84" y="689" fill="#becce0" font-size="20">早期：随机森林</text><text x="84" y="720" fill="#becce0" font-size="20">中后期：多模型软投票</text><text x="84" y="751" fill="#becce0" font-size="20">按分钟过渡混合</text></g><g><rect x="440" y="610" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="440" y="629" width="4" height="28" rx="2" fill="#a5b4fc"/><text x="464" y="653" fill="#f1f5ff" font-size="24" font-weight="700">概率校准</text><text x="464" y="689" fill="#becce0" font-size="20">用校准集拟合校准器</text><text x="464" y="720" fill="#becce0" font-size="20">保存模型与校准配置</text><text x="464" y="751" fill="#becce0" font-size="20">推理层另做一致性检查</text></g><g><rect x="820" y="610" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="820" y="629" width="4" height="28" rx="2" fill="#a5b4fc"/><text x="844" y="653" fill="#f1f5ff" font-size="24" font-weight="700">冻结后的完整管线</text><text x="844" y="689" fill="#becce0" font-size="20">使用已拟合模型与校准</text><text x="844" y="720" fill="#becce0" font-size="20">仅对测试集推理</text><text x="844" y="751" fill="#becce0" font-size="20">不再用测试结果重拟合</text></g><path d="M220 540V610" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 540V610" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M980 540V610" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M380 683H440" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M760 683H820" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="60" y="860" width="700" height="125" rx="17" fill="#101a30" stroke="#33415e"/><rect x="60" y="879" width="4" height="28" rx="2" fill="#67e8f9"/><text x="84" y="903" fill="#f1f5ff" font-size="24" font-weight="700">产物与复现记录</text><text x="84" y="939" fill="#becce0" font-size="20">保存特征、划分、模型版本及样本范围</text><text x="84" y="970" fill="#becce0" font-size="20">辅助样本是训练补充，不是真实分钟过程</text></g><g><rect x="820" y="860" width="320" height="125" rx="17" fill="#101a30" stroke="#33415e"/><rect x="820" y="879" width="4" height="28" rx="2" fill="#67e8f9"/><text x="844" y="903" fill="#f1f5ff" font-size="24" font-weight="700">评估与诊断</text><text x="844" y="939" fill="#becce0" font-size="20">Brier / 准确率 / 校准</text><text x="844" y="970" fill="#becce0" font-size="20">分阶段 / 翻盘 / 时间外</text></g><path d="M600 755V860" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M980 755V860" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M52 1028H1148" stroke="#35425f"/><text x="52" y="1067" fill="#9baec8" font-size="19">经济一致性护栏属于输出兜底，不替代概率校准、独立测试或时间外评估。</text></g></svg>
