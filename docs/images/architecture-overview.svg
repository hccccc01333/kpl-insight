<g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">
<text x="120" y="58" fill="#9fb9d8" font-size="18" letter-spacing="3">KPL INSIGHT / SYSTEM NOTES</text>
<text x="52" y="118" fill="#f2f6ff" font-size="36" font-weight="700">01 / 系统全景</text><text x="52" y="159" fill="#a7bad5" font-size="18">不是每次打开网页都重新采集和训练：数据生产与访问展示分别运行。</text><g><rect x="60" y="205" width="320" height="128" rx="17" fill="#101a30" stroke="#33415e"/><rect x="60" y="224" width="4" height="28" rx="2" fill="#67e8f9"/><text x="84" y="248" fill="#f1f5ff" font-size="24" font-weight="700">数据来源</text><text x="84" y="284" fill="#becce0" font-size="20">官方赛事页面与接口</text><text x="84" y="315" fill="#becce0" font-size="20">历史补充来源 · 分别标注</text></g><g><rect x="440" y="205" width="320" height="128" rx="17" fill="#101a30" stroke="#33415e"/><rect x="440" y="224" width="4" height="28" rx="2" fill="#67e8f9"/><text x="464" y="248" fill="#f1f5ff" font-size="24" font-weight="700">采集与原始归档</text><text x="464" y="284" fill="#becce0" font-size="20">赛程识别 / 单局请求</text><text x="464" y="315" fill="#becce0" font-size="20">原始 JSON / 过程快照</text></g><g><rect x="820" y="205" width="320" height="128" rx="17" fill="#101a30" stroke="#33415e"/><rect x="820" y="224" width="4" height="28" rx="2" fill="#67e8f9"/><text x="844" y="248" fill="#f1f5ff" font-size="24" font-weight="700">解析与质量检查</text><text x="844" y="284" fill="#becce0" font-size="20">战队身份对齐 / 字段处理</text><text x="844" y="315" fill="#becce0" font-size="20">缺失与异常记录 / 数据表</text></g><path d="M380 269H440" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M760 269H820" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="60" y="443" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="60" y="462" width="4" height="28" rx="2" fill="#a5b4fc"/><text x="84" y="486" fill="#f1f5ff" font-size="24" font-weight="700">离线研究与建模</text><text x="84" y="522" fill="#becce0" font-size="20">特征构建 / 训练 / 校准</text><text x="84" y="553" fill="#becce0" font-size="20">时间外测试与基准检查</text><text x="84" y="584" fill="#becce0" font-size="20">产出模型与评估记录</text></g><g><rect x="440" y="443" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="440" y="462" width="4" height="28" rx="2" fill="#a5b4fc"/><text x="464" y="486" fill="#f1f5ff" font-size="24" font-weight="700">比赛日预测与复盘</text><text x="464" y="522" fill="#becce0" font-size="20">当前快照 + 已有模型</text><text x="464" y="553" fill="#becce0" font-size="20">预测归档 / 历史重放</text><text x="464" y="584" fill="#becce0" font-size="20">单局与系列赛分析</text></g><g><rect x="820" y="443" width="320" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="820" y="462" width="4" height="28" rx="2" fill="#a5b4fc"/><text x="844" y="486" fill="#f1f5ff" font-size="24" font-weight="700">统计与报告构建</text><text x="844" y="522" fill="#becce0" font-size="20">战队 / 选手 / 英雄 / BP</text><text x="844" y="553" fill="#becce0" font-size="20">结构化系列赛证据报告</text><text x="844" y="584" fill="#becce0" font-size="20">准备静态展示数据</text></g><path d="M980 333V389H220V443" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M980 389H600V443" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M980 389V443" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M380 516H440" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="440" y="682" width="320" height="122" rx="17" fill="#101a30" stroke="#33415e"/><rect x="440" y="701" width="4" height="28" rx="2" fill="#67e8f9"/><text x="464" y="725" fill="#f1f5ff" font-size="24" font-weight="700">本地工作台</text><text x="464" y="761" fill="#becce0" font-size="20">Streamlit + Plotly</text><text x="464" y="792" fill="#becce0" font-size="20">数据检查 / 模型与复盘</text></g><g><rect x="820" y="682" width="320" height="122" rx="17" fill="#101a30" stroke="#33415e"/><rect x="820" y="701" width="4" height="28" rx="2" fill="#67e8f9"/><text x="844" y="725" fill="#f1f5ff" font-size="24" font-weight="700">公开静态网站</text><text x="844" y="761" fill="#becce0" font-size="20">HTML / CSS / JavaScript</text><text x="844" y="792" fill="#becce0" font-size="20">Pages / Workers</text></g><path d="M600 588V682" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M980 588V682" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><text x="59" y="715" fill="#a7bad5" font-size="18">Python 数据与模型工具</text><text x="59" y="750" fill="#a7bad5" font-size="18">与独立网站仓通过文件连接</text><path d="M52 828H1148" stroke="#35425f"/><text x="52" y="867" fill="#9baec8" font-size="19">来源、模型产物、报告和页面分别维护；具体运行命令以所在仓库为准。</text></g></svg>
