<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc">
<title id="title">02 / 比赛日采集与预测</title><desc id="desc">比赛日从赛程定位单局，轮询接口、保留快照、统一特征、保存预测，并识别结束或异常。</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090f25"/><stop offset="1" stop-color="#1c1734"/></linearGradient>
<linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="1440"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#c4a0ff"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9ccfff" stroke-opacity=".045"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8badd0"/></marker>
</defs>
<rect width="1200" height="1070" rx="28" fill="url(#bg)"/><rect width="1200" height="1070" rx="28" fill="url(#grid)"/>
<path d="M52 50H100" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
<g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">
<text x="120" y="58" fill="#9fb9d8" font-size="18" letter-spacing="3">KPL INSIGHT / SYSTEM NOTES</text>
<text x="52" y="118" fill="#f2f6ff" font-size="36" font-weight="700">02 / 比赛日采集与预测</text><text x="52" y="160" fill="#a7bad5" font-size="18">先取得真实过程，再形成预测记录；历史终局响应不能恢复整场分钟过程。</text><g><rect x="410" y="205" width="380" height="115" rx="17" fill="#101a30" stroke="#33415e"/><rect x="410" y="224" width="4" height="28" rx="2" fill="#67e8f9"/><text x="434" y="248" fill="#f1f5ff" font-size="24" font-weight="700">识别赛程与当前单局</text><text x="434" y="284" fill="#becce0" font-size="20">确认比赛状态与 battle_id</text></g><g><rect x="410" y="385" width="380" height="115" rx="17" fill="#101a30" stroke="#33415e"/><rect x="410" y="404" width="4" height="28" rx="2" fill="#67e8f9"/><text x="434" y="428" fill="#f1f5ff" font-size="24" font-weight="700">按间隔请求官方接口</text><text x="434" y="464" fill="#becce0" font-size="20">核对状态 / 时间 / 返回字段</text></g><path d="M600 320V385" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="50" y="385" width="290" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="50" y="404" width="4" height="28" rx="2" fill="#f0abfc"/><text x="74" y="428" fill="#f1f5ff" font-size="24" font-weight="700">请求失败或暂缺</text><text x="74" y="464" fill="#becce0" font-size="20">记录异常 / 等待重试</text><text x="74" y="495" fill="#becce0" font-size="20">保留未知，不默认为零</text></g><path d="M410 442H340" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M195 385V262H410" fill="none" stroke="#8badd0" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><g><rect x="860" y="385" width="290" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="860" y="404" width="4" height="28" rx="2" fill="#a5b4fc"/><text x="884" y="428" fill="#f1f5ff" font-size="24" font-weight="700">原始快照归档</text><text x="884" y="464" fill="#becce0" font-size="20">保存原始 JSON</text><text x="884" y="495" fill="#becce0" font-size="20">供解析核对与后续研究</text></g><path d="M790 442H860" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="410" y="565" width="380" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="410" y="584" width="4" height="28" rx="2" fill="#67e8f9"/><text x="434" y="608" fill="#f1f5ff" font-size="24" font-weight="700">解析、身份对齐与特征</text><text x="434" y="644" fill="#becce0" font-size="20">按实际战队与阵营解释</text><text x="434" y="675" fill="#becce0" font-size="20">当前局面 + 可用历史先验</text></g><path d="M600 500V565" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="860" y="565" width="290" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="860" y="584" width="4" height="28" rx="2" fill="#a5b4fc"/><text x="884" y="608" fill="#f1f5ff" font-size="24" font-weight="700">已有模型产物</text><text x="884" y="644" fill="#becce0" font-size="20">加载版本与校准信息</text><text x="884" y="675" fill="#becce0" font-size="20">本次采集不重新训练</text></g><g><rect x="410" y="775" width="380" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="410" y="794" width="4" height="28" rx="2" fill="#67e8f9"/><text x="434" y="818" fill="#f1f5ff" font-size="24" font-weight="700">推理并归档预测</text><text x="434" y="854" fill="#becce0" font-size="20">阶段模型 / 校准 / 检查</text><text x="434" y="885" fill="#becce0" font-size="20">保存概率与时间记录</text></g><path d="M600 710V775" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1005 710V848H790" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="50" y="775" width="290" height="145" rx="17" fill="#101a30" stroke="#33415e"/><rect x="50" y="794" width="4" height="28" rx="2" fill="#67e8f9"/><text x="74" y="818" fill="#f1f5ff" font-size="24" font-weight="700">继续还是归档</text><text x="74" y="854" fill="#becce0" font-size="20">进行中 → 后续轮询</text><text x="74" y="885" fill="#becce0" font-size="20">结束 → 切局与结果归档</text></g><path d="M410 848H340" fill="none" stroke="#8badd0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M195 775V610H365V352H600V385" fill="none" stroke="#8badd0" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M52 988H1148" stroke="#35425f"/><text x="52" y="1027" fill="#9baec8" font-size="19">轮询与预测在采集程序中运行；网站需另行导出、构建和发布展示数据。</text></g></svg>
