<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="title desc">
<title id="title">从数据探索，到峡谷有数</title><desc id="desc">2024 年早期数据与预测探索，2026 年工程重构、公开发布和产品扩展。不同阶段分别记录，不将当前全部功能追溯到 2024 年。</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090f25"/><stop offset="1" stop-color="#1c1734"/></linearGradient>
<linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="1440"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#c4a0ff"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9ccfff" stroke-opacity=".045"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8badd0"/></marker>
</defs>
<rect width="1200" height="1440" rx="28" fill="url(#bg)"/><rect width="1200" height="1440" rx="28" fill="url(#grid)"/>
<path d="M52 50H100" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
<g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">
<text x="120" y="58" fill="#9fb9d8" font-size="18" letter-spacing="3">KPL INSIGHT / SYSTEM NOTES</text>
<text x="52" y="118" fill="#f2f6ff" font-size="36" font-weight="700">从数据探索，到峡谷有数</text><text x="52" y="160" fill="#a7bad5" font-size="18">PROJECT JOURNEY · 早期探索 / 工程化 / 产品化</text><path d="M600 238V1270" stroke="url(#accent)" stroke-width="4"/><circle cx="600" cy="256" r="13" fill="#101a30" stroke="#67e8f9" stroke-width="4"/><path d="M550 256H587" stroke="#67e8f9" stroke-width="2"/><rect x="60" y="218" width="490" height="187" rx="18" fill="#111b30" stroke="#35415e"/><text x="84" y="253" fill="#67e8f9" font-size="20" font-weight="700">2024</text><text x="84" y="291" fill="#f3f6ff" font-size="27" font-weight="700">数据与预测探索</text><text x="84" y="326" fill="#bdcbe0" font-size="21">KPL 数据整理与分析</text><text x="84" y="354" fill="#bdcbe0" font-size="21">决赛预测、多模型比较</text><text x="84" y="382" fill="#bdcbe0" font-size="21">探索 BO7 比分模拟</text><circle cx="600" cy="471" r="13" fill="#101a30" stroke="#78cfff" stroke-width="4"/><path d="M613 471H650" stroke="#78cfff" stroke-width="2"/><rect x="650" y="433" width="490" height="187" rx="18" fill="#111b30" stroke="#35415e"/><text x="674" y="468" fill="#78cfff" font-size="20" font-weight="700">2026 · 05</text><text x="674" y="506" fill="#f3f6ff" font-size="27" font-weight="700">重组数据与模型工程</text><text x="674" y="541" fill="#bdcbe0" font-size="21">梳理接口、字段与清洗流程</text><text x="674" y="569" fill="#bdcbe0" font-size="21">5 月 5 日留存接口验证记录</text><text x="674" y="597" fill="#bdcbe0" font-size="21">将早期探索整理为工程</text><circle cx="600" cy="686" r="13" fill="#101a30" stroke="#a5b4fc" stroke-width="4"/><path d="M550 686H587" stroke="#a5b4fc" stroke-width="2"/><rect x="60" y="648" width="490" height="187" rx="18" fill="#111b30" stroke="#35415e"/><text x="84" y="683" fill="#a5b4fc" font-size="20" font-weight="700">2026 · 07 · 21</text><text x="84" y="721" fill="#f3f6ff" font-size="27" font-weight="700">V11 工程记录</text><text x="84" y="756" fill="#bdcbe0" font-size="21">整合采集与局内预测</text><text x="84" y="784" fill="#bdcbe0" font-size="21">实时胜率平台与本地工作台</text><text x="84" y="812" fill="#bdcbe0" font-size="21">连接监控、模型与分析</text><circle cx="600" cy="901" r="13" fill="#101a30" stroke="#c4a0ff" stroke-width="4"/><path d="M613 901H650" stroke="#c4a0ff" stroke-width="2"/><rect x="650" y="863" width="490" height="187" rx="18" fill="#111b30" stroke="#35415e"/><text x="674" y="898" fill="#c4a0ff" font-size="20" font-weight="700">2026 · 10</text><text x="674" y="936" fill="#f3f6ff" font-size="27" font-weight="700">V12 与公开仓发布</text><text x="674" y="971" fill="#bdcbe0" font-size="21">分阶段模型、校准与评估</text><text x="674" y="999" fill="#bdcbe0" font-size="21">10 月 25 日当前公开仓发布</text><text x="674" y="1027" fill="#bdcbe0" font-size="21">分钟复盘与系列赛报告</text><circle cx="600" cy="1116" r="13" fill="#101a30" stroke="#f0abfc" stroke-width="4"/><path d="M550 1116H587" stroke="#f0abfc" stroke-width="2"/><rect x="60" y="1078" width="490" height="187" rx="18" fill="#111b30" stroke="#35415e"/><text x="84" y="1113" fill="#f0abfc" font-size="20" font-weight="700">2026 · 10 · 26–27</text><text x="84" y="1151" fill="#f3f6ff" font-size="27" font-weight="700">分析工作台继续扩展</text><text x="84" y="1186" fill="#bdcbe0" font-size="21">选手 × 英雄与分位数参照</text><text x="84" y="1214" fill="#bdcbe0" font-size="21">战队 BP 风格、教练档案</text><text x="84" y="1242" fill="#bdcbe0" font-size="21">早期历史补充与界面更新</text><path d="M52 1358H1148" stroke="#35425f"/><text x="52" y="1397" fill="#9baec8" font-size="19">从数据与预测探索，逐步连接采集、模型、分析和网站展示。</text></g></svg>
