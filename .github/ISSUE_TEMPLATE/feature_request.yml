name: 功能建议
description: 提出一个新功能、筛选方式或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先搜索现有 Issue，避免重复；一次尽量只描述一个需求。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述使用场景和当前的不便，而不只是给一个功能名称。
      placeholder: 例如：看 BO7 时想比较两队前几局的已用英雄，但现在的页面需要来回切换。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
      description: 说明入口、操作和期望看到的结果；有草图或参考页面也可以附上。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选。说明为什么现有页面或其它工具不能满足需求。
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 前端 / 交互
        - 数据采集 / 字段
        - 模型 / 评估
        - 文档 / 工程
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我没有在 Issue 中包含密钥、个人信息、原始采集数据或未获许可的第三方素材。
          required: true
        - label: 我已经搜索过相似 Issue 和文档，确认不是重复需求。
          required: true
