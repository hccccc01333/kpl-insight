name: 数据订正
description: 报告赛程、比分、选手、英雄或页面数据不一致
title: "[Data] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        数据问题请尽量给出比赛标识、页面位置和可核对的来源。不要上传完整采集目录、录像或签名链接。
  - type: input
    id: match
    attributes:
      label: 比赛 / 系列赛标识
      description: 例如 league_id、match_id、battle_id，或页面上的赛事名称与日期。
      placeholder: 2026102201 / 第 3 局
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 页面链接
      description: 出现问题的页面地址；能复制完整 URL 最好。
      placeholder: https://kpldata-site.hccccc01333.workers.dev/match.html?id=...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你认为正确的值是什么，依据是什么。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 页面上显示的值；有截图可以拖入，但请先遮挡个人信息。
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 官方或可核对来源
      description: 官方赛程/比分页、录像时间点或公开数据页链接。
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 可选。说明是单局还是大场、是否跨版本、是否只在手机端出现。
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我没有上传密钥、个人信息、完整采集目录或未获许可的第三方素材。
          required: true
        - label: 我理解数据订正需要核对来源，不一定按 Issue 描述直接修改。
          required: true
