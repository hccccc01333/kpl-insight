name: source-checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python tools/check_public_files.py
      - run: python tools/check_links.py --external
      - run: python -m pip install -e .
      - run: python -m compileall -q kpl_insight apps tests
      - run: python -m unittest discover -s tests -v
      - run: python tests/check_monitor_rolling.py
      - run: python -m kpl_insight demo
      - run: python -m kpl_insight monitor --help

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python tools/check_public_files.py
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_frontend tests.test_local_runtime -v
      - run: python -m kpl_insight demo
      - run: python start.py --help
