name: source-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python tools/check_public_files.py
      - run: python -m pip install -e .
      - run: python -m compileall -q kpl_insight apps tests
      - run: python -m unittest discover -s tests -v
      - run: python tests/check_monitor_rolling.py
      - run: python -m kpl_insight demo
      - run: python -m kpl_insight monitor --help
